<body class="bg-surface-dim text-on-surface min-h-screen flex items-center justify-center font-body-md p-edge_margin">
<!-- Login Card Container -->
<main class="w-full max-w-5xl bg-surface-container flex flex-col md:flex-row rounded-xl border border-outline-variant overflow-hidden shadow-[0_0_24px_rgba(0,0,0,0.8)] min-h-[600px] relative z-10">
<!-- Left Side: Technical Visual -->
<section class="hidden md:flex md:w-1/2 relative bg-surface-container-lowest border-r border-outline-variant overflow-hidden flex-col items-center justify-center p-8">
<!-- Image Background -->
<div class="absolute inset-0 bg-cover bg-center opacity-30 mix-blend-screen pointer-events-none" data-alt="A highly detailed, professional 3D wireframe render of a modern commercial vehicle cab interior in a minimalist technical environment. The vector-style lines glow faintly in electric blue against a deep charcoal background, emphasizing precise engineering, sensor arrays, and navigation pathfinding algorithms. Dramatic studio lighting highlights the high-tech, reliable nature of an advanced logistics software platform. Minimalist, industrial aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC2Rtb2DrcOo4mcc1Sk03dO-N9r8srED5xNKWcN0HHR7KIW9sHDqT-iqvCzDFHZFeKFaVmAJujL5hZHLQiRvjTtalEvtUm9lv9vel9Nl9FHSaaMM4SSOVMX2LTUWUVrYMGH-z4E_rg9sOttFS6J5HgBEyvOA8SV0TEgxP9ARTyoDJ5Tokfcm2fck64ciuoo2NGrKy4lxeJUZDTi9CtNMUMpaMQSKUNPWFdPZBxkGJ8Kc2iNt7ZjolwU')"></div>
<!-- Grid Overlay to enhance technical feel -->
<div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')] opacity-50 pointer-events-none"></div>
<div class="relative z-10 text-center flex flex-col items-center gap-4">
<div class="w-24 h-24 rounded-full border border-primary/30 bg-surface/50 flex items-center justify-center backdrop-blur-sm relative before:absolute before:inset-0 before:rounded-full before:border before:border-primary before:animate-ping before:opacity-20">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">route</span>
</div>
<div>
<h2 class="text-headline-lg font-headline-lg text-on-surface tracking-wide">SECURE ACCESS</h2>
<p class="text-mono-data font-mono-data text-on-surface-variant uppercase tracking-widest mt-2">Telemetry &amp; Navigation Core</p>
</div>
</div>
<!-- Technical decoration corners -->
<div class="absolute top-4 left-4 w-4 h-4 border-t border-l border-outline"></div>
<div class="absolute bottom-4 right-4 w-4 h-4 border-b border-r border-outline"></div>
</section>
<!-- Right Side: Login Form -->
<section class="w-full md:w-1/2 flex flex-col justify-center p-8 sm:p-12 bg-surface relative">
<!-- Branding Header -->
<header class="mb-10 flex flex-col gap-2">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-[32px]">memory</span>
<h1 class="text-display-navigation font-display-navigation text-primary tracking-tight">IntelliDR</h1>
</div>
<div class="inline-flex">
<span class="px-2 py-1 bg-surface-container-high rounded border border-outline-variant text-label-caps font-label-caps text-secondary tracking-widest uppercase">
                        USER PORTAL
                    </span>
</div>
</header>
<!-- Form -->
<form data-auth-form data-redirect="../intellidr_admin_dashboard/code.html" class="flex flex-col gap-5 w-full max-w-sm" method="POST">
  <div data-auth-status class="hidden rounded border border-red-500/50 bg-red-500/10 px-3 py-2 text-sm text-red-200"></div>
  <!-- Username / Email Field -->
  <div class="flex flex-col gap-1.5">
    <label class="text-mono-data font-mono-data text-on-surface-variant uppercase tracking-wide" for="identifier">Operator ID / Email</label>
    <div class="relative flex items-center">
      <span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none text-[20px]">badge</span>
      <input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary text-on-surface pl-10 pr-4 py-3 h-[48px] text-body-md font-body-md transition-colors placeholder:text-on-surface-variant/50" id="identifier" name="identifier" placeholder="Enter identification" type="text"/>
    </div>
  </div>
  <!-- Password Field -->
  <div class="flex flex-col gap-1.5">
    <div class="flex justify-between items-end">
      <label class="text-mono-data font-mono-data text-on-surface-variant uppercase tracking-wide" for="passcode">Security Key</label>
      <a class="text-label-caps font-label-caps text-primary hover:text-primary-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded px-1" href="#">FORGOT?</a>
    </div>
    <div class="relative flex items-center group">
      <span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none text-[20px]">lock</span>
      <input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary text-on-surface pl-10 pr-12 py-3 h-[48px] text-body-md font-body-md transition-colors placeholder:text-on-surface-variant/50" id="passcode" name="passcode" placeholder="••••••••" type="password"/>
      <button aria-label="Toggle password visibility" class="absolute right-3 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none focus:text-primary h-full flex items-center justify-center w-8" id="togglePassword" type="button">
        <span class="material-symbols-outlined text-[20px]" id="visibilityIcon">visibility</span>
      </button>
    </div>
  </div>
  <!-- Remember Me -->
  <div class="flex items-center gap-3 mt-1">
    <input class="w-[20px] h-[20px] rounded-[4px] border-outline-variant bg-surface-container-lowest text-inverse-primary focus:ring-primary focus:ring-offset-surface focus:ring-offset-2 cursor-pointer transition-colors" id="remember" name="remember" type="checkbox"/>
    <label class="text-body-md font-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Maintain encrypted session</label>
  </div>
  <!-- Submit Action -->
  <button class="w-full bg-inverse-primary hover:bg-[#00479e] active:bg-[#00367a] text-white text-headline-md font-headline-md h-[56px] rounded-lg mt-4 transition-all flex justify-center items-center gap-3 shadow-[0_4px_12px_rgba(0,90,194,0.3)] focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-surface" type="submit">
    <span>Authenticate</span>
    <span class="material-symbols-outlined text-[24px]">arrow_forward</span>
  </button>
</form>
<!-- Admin Access Link -->
<footer class="mt-auto pt-10 flex border-t border-outline-variant/50 mt-12 w-full max-w-sm">
  <a class="flex items-center gap-2 text-mono-data font-mono-data text-on-surface-variant hover:text-primary transition-colors group focus:outline-none focus:text-primary rounded" href="../intellidr_admin_login/code.html">
    <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">admin_panel_settings</span>
    <span>Admin Access Gateway</span>
  </a>
</footer>
</section>
</main>
<script src="../app.js"></script>
<script>
  const toggleButton = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('passcode');
  const visibilityIcon = document.getElementById('visibilityIcon');

  toggleButton.addEventListener('click', () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    visibilityIcon.textContent = type === 'text' ? 'visibility_off' : 'visibility';
    visibilityIcon.style.color = type === 'text' ? '#adc6ff' : '';
  });
</script>
</body></html>
