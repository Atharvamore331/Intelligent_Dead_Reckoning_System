<!DOCTYPE html>

<html class="dark" lang="en"><head>

<title>User Live Navigation Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                extend: {

                        "surface-dim": "#10131a",
                        "tertiary-fixed-dim": "#ffb786",

                        "background": "#10131a",
                        "error": "#ffb4ab",

<style>
        .map-bg {
            background-color: #0B0B0C;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(39, 39, 42, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(39, 39, 42, 0.5) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }
        .overlay-card {
            background-color: rgba(20, 20, 22, 0.9);
            border: 1px solid #27272A;
            backdrop-filter: blur(8px);
        }
        .hud-value {
            text-shadow: 0 0 10px rgba(173, 198, 255, 0.3);
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden font-body-md relative flex flex-col">
<!-- Level 0: Interactive Map (Simulated) -->
<div class="absolute inset-0 z-0 map-bg flex items-center justify-center">
<!-- Simulated Route Polyline -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="xMidYMid slice" viewbox="0 0 1000 1000">
<path d="M 200 800 C 300 600, 400 500, 500 400 S 700 200, 800 100" fill="none" opacity="0.6" stroke="#3B82F6" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"></path>
<path d="M 500 400 S 700 200, 800 100" fill="none" opacity="0.9" stroke="#6ffbbe" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
</svg>
<!-- Simulated Vehicle Icon -->
<div class="absolute z-10 transform -translate-x-1/2 -translate-y-1/2 shadow-[0_0_15px_rgba(59,130,246,0.5)]" style="top: 40%; left: 50%; rotate: 45deg;">
<svg fill="none" height="48" viewbox="0 0 32 48" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M16 2L2 46L16 38L30 46L16 2Z" fill="#3B82F6" stroke="#ffffff" stroke-linejoin="round" stroke-width="2"></path>
<circle cx="16" cy="24" fill="#6ffbbe" r="4"></circle>
</svg>
</div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-edge_margin h-touch_target_min bg-surface-container dark:bg-surface-container border-b border-outline-variant dark:border-outline-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary">memory</span>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary">IntelliDR</h1>
</div>
<div class="flex items-center gap-4">
<div class="hidden md:flex items-center gap-2 px-3 py-1 bg-secondary-container/20 rounded-full border border-secondary-container/30">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="text-label-caps font-label-caps text-secondary">GNSS + INS</span>
</div>
<span class="text-mono-data font-mono-data text-on-surface-variant">VH-7492</span>
<button class="hover:bg-surface-bright transition-colors active:scale-95 rounded-full p-1">
<span class="material-symbols-outlined text-primary dark:text-primary">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas (Overlays) -->
<main class="relative z-10 flex-grow mt-touch_target_min mb-[72px] md:mb-0 p-edge_margin flex flex-col justify-between pointer-events-none">
<!-- Top HUD Row -->
<div class="flex justify-between items-start pointer-events-auto">
<!-- Navigation Mode & Heading -->
<div class="flex flex-col gap-stack_gap">
<div class="md:hidden flex items-center gap-2 px-3 py-1 bg-secondary-container/20 rounded-full border border-secondary-container/30 w-fit">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="text-label-caps font-label-caps text-secondary">GNSS + INS</span>
</div>
<div class="overlay-card rounded-lg p-3 flex flex-col items-center justify-center w-24">
<span class="text-label-caps font-label-caps text-on-surface-variant">HEADING</span>
<div class="flex items-baseline gap-1 hud-value">
<span class="text-headline-lg font-headline-lg text-on-surface">NE</span>
<span class="text-mono-data font-mono-data text-on-surface-variant">045°</span>
</div>
</div>
</div>
<!-- Demo Controls -->
<div class="flex flex-col gap-stack_gap items-end">
<button class="bg-[#3B82F6] text-white font-mono-data text-mono-data font-semibold px-4 py-2 rounded shadow-lg active:scale-95 transition-transform">
                    START SIMULATION
                </button>
<button class="overlay-card text-on-surface font-mono-data text-mono-data px-4 py-2 rounded flex items-center gap-2 hover:bg-surface-bright active:scale-95 transition-all">
<span>GNSS</span>
<div class="w-8 h-4 bg-secondary rounded-full relative">
<div class="absolute right-0.5 top-0.5 w-3 h-3 bg-white rounded-full"></div>
</div>
</button>
</div>
</div>
<!-- Notification Area (Hidden by default, placeholder) -->
<div class="w-full flex justify-center hidden pointer-events-auto">
<div class="bg-error-container text-on-error-container px-6 py-3 rounded-lg border border-error flex items-center gap-3 shadow-lg">
<span class="material-symbols-outlined" data-weight="fill">warning</span>
<span class="font-body-md font-semibold text-body-md">GNSS Signal Lost - Estimating</span>
</div>
</div>
<!-- Bottom HUD Row (Telemetry) -->
<div class="flex flex-col md:flex-row gap-stack_gap md:gap-4 w-full md:w-auto pointer-events-auto">
<!-- Speed -->
<div class="overlay-card rounded-xl p-card_padding flex-1 md:w-48 flex flex-col justify-between relative overflow-hidden">
<div class="absolute bottom-0 left-0 w-full h-1 bg-surface-container">
<div class="h-full bg-secondary w-3/4"></div>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">SPEED</span>
<div class="flex items-baseline gap-1 mt-2 hud-value">
<span class="text-display-navigation font-display-navigation text-on-surface">68</span>
<span class="text-mono-data font-mono-data text-on-surface-variant">km/h</span>
</div>
</div>
<div class="grid grid-cols-2 md:grid-cols-3 gap-stack_gap md:gap-4 flex-1">
<!-- ETA -->
<div class="overlay-card rounded-lg p-3 flex flex-col justify-center">
<span class="text-label-caps font-label-caps text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">schedule</span> ETA
                    </span>
<div class="flex items-baseline gap-1 mt-1">
<span class="text-headline-lg font-headline-lg text-primary">09</span>
<span class="text-mono-data font-mono-data text-on-surface-variant">min</span>
</div>
</div>
<!-- Dist Remaining -->
<div class="overlay-card rounded-lg p-3 flex flex-col justify-center">
<span class="text-label-caps font-label-caps text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">turn_right</span> REMAINING
                    </span>
<div class="flex items-baseline gap-1 mt-1">
<span class="text-headline-md font-headline-md text-on-surface">8.4</span>
<span class="text-mono-data font-mono-data text-on-surface-variant">km</span>
</div>
</div>
<!-- Dist Covered (Hidden on mobile grid, shown below or in carousel usually, but putting here for brevity) -->
<div class="overlay-card rounded-lg p-3 flex flex-col justify-center col-span-2 md:col-span-1">
<span class="text-label-caps font-label-caps text-on-surface-variant">COVERED</span>
<div class="flex items-baseline gap-1 mt-1">
<span class="text-headline-md font-headline-md text-on-surface-variant">12.6</span>
<span class="text-mono-data font-mono-data text-on-surface-variant">km</span>
</div>
</div>
</div>
</div>
<!-- Map Controls FABs -->
<div class="absolute right-edge_margin bottom-24 md:bottom-edge_margin flex flex-col gap-2 pointer-events-auto">
<button class="w-12 h-12 bg-[#1C1C1E] border border-[#27272A] rounded shadow-[0_0_8px_rgba(0,0,0,0.5)] flex items-center justify-center text-on-surface hover:bg-surface-bright active:scale-95 transition-all">
<span class="material-symbols-outlined">add</span>
</button>
<button class="w-12 h-12 bg-[#1C1C1E] border border-[#27272A] rounded shadow-[0_0_8px_rgba(0,0,0,0.5)] flex items-center justify-center text-on-surface hover:bg-surface-bright active:scale-95 transition-all">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="w-12 h-12 bg-[#1C1C1E] border border-[#27272A] rounded shadow-[0_0_8px_rgba(0,0,0,0.5)] flex items-center justify-center text-primary mt-2 hover:bg-surface-bright active:scale-95 transition-all">
<span class="material-symbols-outlined">my_location</span>
</button>
</div>
</main>

<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-around items-center px-edge_margin py-2 bg-surface-container-highest dark:bg-surface-container-highest text-label-caps font-label-caps border-t border-outline-variant dark:border-outline-variant">

<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-3 py-1 hover:bg-surface-container-high transition-colors active:scale-95 transition-transform" data-route="../intellidr_live_navigation/code.html" href="../intellidr_live_navigation/code.html">
